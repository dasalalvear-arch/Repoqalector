services:
  db:
    # pgvector/pgvector trae la extension `vector` precompilada; la imagen
    # postgres oficial no la incluye y CREATE EXTENSION fallaria.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: repoqa
      POSTGRES_USER: repoqa
      POSTGRES_PASSWORD: repoqa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repoqa -d repoqa"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      # La key real vive en `.env` en la raiz (ignorado por git), nunca aqui ni
      # en backend/.env.example, que si estan versionados. Compose lee ese .env
      # solo y sustituye el valor al levantar.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      # Sets de evaluacion: son datos, se editan sin rebuild.
      - ./backend/eval:/app/eval
      # Cache de los modelos de sentence-transformers: sin esto se re-descargan
      # ~90MB cada vez que se recrea el contenedor.
      - hf_models:/models

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  postgres_data:
  hf_models:
